<style>

.wrap{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;max-width:1100px;margin:auto;align-items:start}
.wrap>*{min-width:0}

input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}

input[type=checkbox]{width:auto}input[type=range]{padding:0}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--blue);color:#fff;font-size:13px;font-weight:600}
button.alt{background:var(--line);color:var(--text)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.tabs button{white-space:nowrap;background:var(--line);color:var(--text)}.tabs button.on{background:var(--blue);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.c,label.t{display:flex;justify-content:space-between;align-items:center;color:var(--text)}
label.r b{float:right;color:var(--text)}

.pre{height:62px;border-radius:10px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#aab;display:inline-block;margin-right:6px}.dot.on{background:#22c55e}
.tl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.tl img{height:28px}.tl button{margin-left:auto;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:var(--line);color:var(--text)}
#gear{display:none;position:fixed;top:10px;right:10px;z-index:9}.clean #gear{display:block}
#fab{position:fixed;top:10px;left:10px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 130px)}
#fab button{box-shadow:0 2px 8px #0004}
.clean #fab{display:none}@media(pointer:coarse){.clean #fab{display:flex}}
.mod{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:12px}
.mod>div{background:var(--panel);color:var(--text);border-radius:12px;padding:12px;width:min(520px,100%);max-height:94vh;overflow:auto}
.mod canvas{width:100%;max-height:48vh;object-fit:contain;display:block;border-radius:8px;background:repeating-conic-gradient(#8885 0 25%,transparent 0 50%) 0 0/16px 16px;cursor:crosshair}
.clean .panel{display:none}.clean .wrap{grid-template-columns:minmax(0,1fr)}
/* overlay */
.stage{--sg:#eef1fb;--si:none;min-height:640px;border-radius:12px;border:1px solid var(--line);background:var(--sg) var(--si) center/cover no-repeat;padding:22px 20px;display:flex;flex-direction:column;overflow:hidden}
.stage.tr{background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/20px 20px}
.stage.tr .fx{display:none}
.feed{display:flex;flex-direction:column;gap:var(--gap);max-width:100%}
.msg{width:fit-content;max-width:min(var(--mw),100%);font-size:var(--fs);position:relative}
.msg:nth-child(even){margin-left:var(--ind)}
.a-slide .msg.new{animation:s .3s}.a-pop .msg.new{animation:p .3s}.a-fade .msg.new{animation:f .5s}
@keyframes s{from{opacity:0;transform:translateX(-18px)}}@keyframes p{from{opacity:0;transform:scale(.8)}}@keyframes f{from{opacity:0}}
.head{display:flex;align-items:stretch;position:relative;z-index:1}
.nm{background:var(--nb) var(--ni) center/cover;color:var(--nt);padding:.38em .8em .38em .55em;font-weight:600;display:flex;align-items:center;gap:.45em;transform:rotate(calc(var(--tilt)*-1));transform-origin:left bottom;border:var(--bw) solid var(--bd);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.sq,.pdot{font-style:normal;display:inline-block;flex:none}
.sq{width:.6em;height:.6em;border:2px solid currentColor}.pdot{width:.8em;height:.8em;border-radius:50%;border:2px solid var(--bd);align-self:center;margin-left:.3em}
.yt{--pc:var(--yc)}.tt{--pc:var(--tc)}.sq,.pdot{background:var(--pc)}

.tg img{height:var(--ts);display:block}
.body{position:relative;background:color-mix(in srgb,var(--bb) var(--bo),transparent) var(--bi) center/cover;color:var(--bt);border:var(--bw) solid var(--bd);border-radius:0 var(--r) var(--r) var(--r);margin-top:calc(var(--bw)*-1);padding:.55em 1.1em .5em;box-shadow:var(--so) var(--so) 0 var(--sh),0 0 var(--gl) var(--sh)}
.t{font-weight:700;font-size:1.05em;word-break:break-word;padding-right:1.1em}
.meta{font:700 9px "Space Mono",monospace;color:var(--mt);letter-spacing:1px;margin-top:.6em;text-transform:uppercase}
.ic{position:absolute;right:-12px;bottom:-14px;width:32px;height:32px;border-radius:50%;background-color:#fff;background-size:cover;background-position:center;border:var(--bw) solid var(--bd);display:grid;place-items:center;font:700 9px "Space Mono",monospace;color:var(--bd)}
.ic.yt{background-image:var(--yi)}.ic.tt{background-image:var(--ti)}
.gift .head{display:block}.gift .nm{background:var(--gf) var(--ni) center/cover;color:var(--gt);transform:none}
.gift .body{background:var(--gf) var(--gi) center/cover;color:var(--gt);border-radius:0 0 var(--r) var(--r)}
.uc .msg{--bd:var(--uc);--bt:var(--uc);--nt:var(--uc);--sh:var(--uc);--mt:var(--uc)}.uc .t{text-shadow:0 0 6px var(--uc)}
.lay-float .msg{padding-top:.7em}
.lay-float .head{position:absolute;top:0;left:.8em}
.lay-float .nm{transform:none;font-size:.72em;padding:.1em .6em;border:var(--bw) solid var(--bd);border-radius:calc(var(--r)*.5)}
.lay-float .bd{font-size:.72em}

.lay-float .gift .head{display:flex}.lay-float .gift .nm{color:var(--gt)}.lay-float .gift .body{border-radius:var(--r)}
.skm{font-size:16px}.sk{position:relative}.sk img{display:block;width:100%;pointer-events:none}
.ska{position:absolute;display:flex;flex-direction:column;justify-content:center;overflow:hidden;line-height:1.25}
.skn{font-weight:700;display:flex;align-items:center;gap:.4em}.skn.free{position:absolute;white-space:nowrap}.skn .sq{width:.6em;height:.6em}
.skt{word-break:break-word}
.pv{position:relative;background:repeating-conic-gradient(#8884 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:8px;margin:8px 0;overflow:hidden}.pv img{display:block;width:100%}
.pvb{position:absolute;border:2px dashed #ff3d7f;background:#ff3d7f22;cursor:move;touch-action:none}.pvh{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;background:#ff3d7f;cursor:nwse-resize}
.sl{display:flex;gap:6px;overflow-x:auto}.th{flex:none;width:84px;height:54px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;background:repeating-conic-gradient(#8884 0 25%,transparent 0 50%) 0 0/12px 12px;cursor:pointer}.th.on{border-color:var(--blue)}.th img{max-width:100%;max-height:100%}
.stage{position:relative}.feed{position:relative;z-index:1}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fxp{position:absolute;top:0;line-height:1;opacity:.85;animation:fd linear infinite}.fxp.up{animation-name:fu}
@keyframes fd{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(var(--dx),calc(var(--h) + 40px)) rotate(360deg)}}
@keyframes fu{from{transform:translate(0,calc(var(--h) + 40px))}to{transform:translate(var(--dx),-60px) rotate(40deg)}}
</style>
</head>
